[global]
type=global
user_agent=SoftphonePBX

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Endpoint template for WebRTC clients ----
[webrtc_client](!)
type=endpoint
context=local
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
ice_support=yes
use_avpf=yes
media_encryption=dtls
media_use_received_transport=yes
rtcp_mux=yes

[webrtc_auth](!)
type=auth
auth_type=userpass

[webrtc_aor](!)
type=aor
max_contacts=5
remove_existing=yes

; ---- Extension 1001 / alice ----
[1001](webrtc_client)
auth=1001
aors=1001

[1001](webrtc_auth)
username=1001
password=secret1001

[1001](webrtc_aor)

