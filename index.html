<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Click-to-Call</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Click-to-Call</h1>
        <span id="status" class="status status-offline">Offline</span>
      </header>

      <div id="mock-banner" class="banner hidden">Mock mode — no real SIP traffic.</div>

      <section id="config-panel" class="panel">
        <h2>Account</h2>
        <form id="config-form">
          <label>
            WebSocket URI
            <input id="cfg-ws" type="url" placeholder="wss://sip.example.com:7443/ws" required />
          </label>
          <label>
            SIP URI
            <input id="cfg-uri" type="text" placeholder="sip:alice@example.com" required />
          </label>
          <label>
            Auth user
            <input id="cfg-user" type="text" placeholder="alice" required />
          </label>
          <label>
            Password
            <input id="cfg-pass" type="password" required />
          </label>
          <label>
            Display name (optional)
            <input id="cfg-name" type="text" placeholder="Alice" />
          </label>
          <details>
            <summary>Advanced (ICE / TURN)</summary>
            <label>
              STUN URL
              <input id="cfg-stun" type="text" placeholder="stun:stun.l.google.com:19302" />
            </label>
            <label>
              TURN URL
              <input id="cfg-turn" type="text" placeholder="turn:turn.example.com:3478" />
            </label>
            <label>
              TURN user
              <input id="cfg-turn-user" type="text" />
            </label>
            <label>
              TURN password
              <input id="cfg-turn-pass" type="password" />
            </label>
          </details>
          <div class="row">
            <button type="submit" id="btn-register">Register</button>
            <button type="button" id="btn-unregister" disabled>Unregister</button>
          </div>
        </form>
      </section>

      <section id="devices-panel" class="panel">
        <h2>Audio devices</h2>
        <label>
          Microphone
          <select id="dev-input"></select>
        </label>
        <label>
          Speaker
          <select id="dev-output"></select>
        </label>
        <div class="row">
          <button type="button" id="btn-grant-mic">Grant mic access</button>
        </div>
      </section>

      <section id="dialer-panel" class="panel">
        <h2>Dialer</h2>
        <input id="dial-input" type="text" placeholder="+15551234567 or alice" />
        <div class="keypad">
          <button data-dtmf="1">1</button><button data-dtmf="2">2</button><button data-dtmf="3">3</button>
          <button data-dtmf="4">4</button><button data-dtmf="5">5</button><button data-dtmf="6">6</button>
          <button data-dtmf="7">7</button><button data-dtmf="8">8</button><button data-dtmf="9">9</button>
          <button data-dtmf="*">*</button><button data-dtmf="0">0</button><button data-dtmf="#">#</button>
        </div>
        <div class="row">
          <button id="btn-call" disabled>Call</button>
        </div>
        <p class="hint">Enter to dial, Esc to hangup.</p>
      </section>

      <section id="call-panel" class="panel hidden">
        <h2 id="call-state">Idle</h2>
        <p id="call-peer"></p>
        <p id="call-timer">00:00</p>
        <div class="volume-bar"><div id="volume-fill"></div></div>
        <div class="row">
          <button id="btn-answer" class="hidden">Answer</button>
          <button id="btn-reject" class="hidden">Reject</button>
          <button id="btn-hangup" class="hidden">Hangup</button>
          <button id="btn-mute" class="hidden">Mute</button>
        </div>
      </section>

      <section id="history-panel" class="panel">
        <h2>Call history</h2>
        <ul id="history-list"></ul>
      </section>

      <audio id="remote-audio" autoplay></audio>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
